<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>PIXEL BATTLE</h1>
  <div class="hud">
    <span>❤️‍🔥 HP: <span id="hp">100</span></span>
    <span>✨ Score: <span id="score">0</span></span>
  </div>
  <canvas id="game" width="480" height="270"></canvas>
  <div id="startScreen">
    <h2>READY TO FIGHT?</h2>
    <button onclick="startGame()">START GAME</button>
  </div>
  <div class="controls">
    <div>
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>
    <div>
      <button id="jump">↑</button>
      <button id="fight">✦</button>
      <button id="shoot">●</button>
    </div>
  </div>
  <p class="legend">MOVE · JUMP · FIGHT · SHOOT</p>
  <script src="script.js"></script>
</body>
</html>
